version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: vishnufit-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: vishnufit
    volumes:
      - mongodb_data:/data/db
    networks:
      - vishnufit-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vishnufit-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/vishnufit
      JWT_SECRET: super_secure_jwt_secret_vishnufit_campus_gym_2025
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - vishnufit-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vishnufit-client
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - vishnufit-network

volumes:
  mongodb_data:
    driver: local

networks:
  vishnufit-network:
    driver: bridge
